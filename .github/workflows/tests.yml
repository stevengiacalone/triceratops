name: tests

on:
  push:
    branches: [master, development]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    # Fast tests that only need the light dependency set (numpy/scipy/
    # astropy/pandas/...). Skips anything marked "heavy".
    name: core (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=7" numpy scipy astropy pandas mechanicalsoup beautifulsoup4
      - name: Run fast tests
        run: pytest -m "not heavy" -v

  full:
    # Full install and the complete suite, including tests that import
    # marginal_likelihoods / triceratops (pytransit, celerite, lightkurve).
    name: full (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install triceratops
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=7"
          pip install .
      - name: Show environment
        run: |
          pip list
          python -c "import numpy, scipy; print('numpy', numpy.__version__, 'scipy', scipy.__version__)"
          python -c "import triceratops.triceratops, triceratops.marginal_likelihoods; print('imports OK')"
      - name: Run full test suite
        run: pytest -v

  tutorial:
    # End-to-end smoke test: the first tutorial example (WASP-156b) run
    # with a small N, plus a Gaia-vs-TRILEGAL field-population check.
    # Hits MAST, Gaia and TRILEGAL, so it is allowed to fail without
    # failing the workflow -- inspect its log for regressions.
    name: tutorial smoke (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install triceratops
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Run tutorial smoke test
        run: python tests/manual/tutorial_smoke.py
      - name: Compare background-population sources
        env:
          SMOKE_REPEATS: "2"
        run: python tests/manual/background_source_comparison.py --fpp
